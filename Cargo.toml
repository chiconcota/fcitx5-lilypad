[package]
name = "vnlilypad"
version = "1.0.0-alpha"
edition = "2021"
authors = ["vnlilypad contributors"]
description = "Native Wayland Vietnamese IME with Sequential Event Queue & ACK Barrier"
default-run = "vnlilypad"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "=0.31.2", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "=0.2.0", features = ["client"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"
libc = "0.2"
